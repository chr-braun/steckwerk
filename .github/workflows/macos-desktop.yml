name: macOS Desktop

# Baut die native App „Steckwerk Desktop“ (packaging/swift) auf einem macOS-Runner.
# Der Branch „updates“ und Tags werden bewusst nicht angefasst – außer im Job „kanal“: Der läuft nur, wenn
# die Commit-Nachricht „[kanal veröffentlichen]“ enthält oder beim manuellen Start „kanal“ gewählt ist, und
# stellt dann Mac-App, Steckwerk Desktop und die geänderten Pakete in den Update-Kanal.
on:
  push:
    branches-ignore: [updates]
    tags-ignore: ["*"]
    paths:
      - "packaging/swift/**"
      - "packaging/build_macos.py"
      - "packaging/update_kanal.py"
      - ".github/workflows/macos-desktop.yml"
      - "*.py"
      - "models/**"
      - "motive/**"
      - "web/**"
  pull_request:
    paths:
      - "packaging/swift/**"
      - "packaging/build_macos.py"
      - "packaging/update_kanal.py"
      - ".github/workflows/macos-desktop.yml"
      - "*.py"
      - "models/**"
      - "motive/**"
      - "web/**"
  workflow_dispatch:
    inputs:
      kanal:
        description: "Update-Kanal (Branch updates) mit dieser Version veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bauen, testen, App-Bundle
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          python3 --version

      - name: Bauen
        working-directory: packaging/swift
        run: swift build

      - name: Python-Tests für Startskript und ChatGPT
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q pytest
          "$RUNNER_TEMP/venv/bin/python" -m pytest -v tests/test_desktop_bridge.py tests/test_updater.py

      - name: Tests (mit Integrationstest gegen die echte Engine)
        working-directory: packaging/swift
        env:
          STECKWERK_ROOT: ${{ github.workspace }}
        run: swift test

      - name: App-Bundle bauen (Apple Silicon und Intel)
        working-directory: packaging/swift
        run: ./build_app.sh ../dist

      - name: Bundle prüfen
        run: |
          APP="packaging/dist/Steckwerk Desktop.app"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/SteckwerkDesktop"
          test -f "$APP/Contents/Resources/engine/webui.py"
          test -f "$APP/Contents/Resources/engine/bridge_start.py"

      - name: Selbsttest des fertigen Bundles
        run: '"packaging/dist/Steckwerk Desktop.app/Contents/MacOS/SteckwerkDesktop" --self-test'

      - name: ZIP erstellen
        working-directory: packaging/dist
        run: ditto -c -k --norsrc --noextattr --noacl --keepParent "Steckwerk Desktop.app" Steckwerk-Desktop-macOS.zip

      - name: Selbst-Update prüfen (ältere App durch das ZIP ersetzen, danach Signatur und Selbsttest)
        run: |
          T="$RUNNER_TEMP/selbstupdate"
          mkdir -p "$T/Programme" "$T/daten"
          ditto "packaging/dist/Steckwerk Desktop.app" "$T/Programme/Steckwerk Desktop.app"
          plutil -replace CFBundleShortVersionString -string 0.0.1 "$T/Programme/Steckwerk Desktop.app/Contents/Info.plist"
          STECKWERK_DATEN="$T/daten" STECKWERK_UPDATE_KANAL="file://$T/kanal/feed.json" python3 - "$T" <<'PY'
          import os, sys
          sys.path[:0] = [os.getcwd(), os.path.join(os.getcwd(), "packaging")]
          import update_kanal, updater
          from steckwerk import __version__
          t = sys.argv[1]
          feed = update_kanal.build(os.path.join(t, "kanal"), None, [], desktop="packaging/dist/Steckwerk-Desktop-macOS.zip")
          assert feed["programm"]["desktop"], feed
          app = os.path.join(t, "Programme", "Steckwerk Desktop.app")
          updater.__version__ = "0.0.1"
          check = updater.check(desktop=app)["programm"]
          assert check["kann_installieren"], check
          print(updater.install_desktop(app))
          assert updater.app_version(app) == __version__
          PY
          codesign --verify --deep --strict --verbose=2 "$T/Programme/Steckwerk Desktop.app"
          "$T/Programme/Steckwerk Desktop.app/Contents/MacOS/SteckwerkDesktop" --self-test

      - name: DMG erstellen
        working-directory: packaging/swift
        run: ./make_dmg.sh "../dist/Steckwerk Desktop.app" ../dist/Steckwerk-Desktop-macOS.dmg

      - name: DMG prüfen (einhängen, Inhalt, Selbsttest aus dem Image)
        run: |
          MNT="$(mktemp -d)"
          hdiutil attach packaging/dist/Steckwerk-Desktop-macOS.dmg -nobrowse -readonly -mountpoint "$MNT"
          ls -la "$MNT"
          test -L "$MNT/Programme"
          codesign --verify --deep --strict "$MNT/Steckwerk Desktop.app"
          "$MNT/Steckwerk Desktop.app/Contents/MacOS/SteckwerkDesktop" --self-test
          hdiutil detach "$MNT"

      - name: DMG hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Steckwerk-Desktop-macOS-dmg
          path: packaging/dist/Steckwerk-Desktop-macOS.dmg
          retention-days: 14
          if-no-files-found: error

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Steckwerk-Desktop-macOS
          path: packaging/dist/Steckwerk-Desktop-macOS.zip
          retention-days: 14
          if-no-files-found: error

  kanal:
    name: Update-Kanal veröffentlichen
    needs: build
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[kanal veröffentlichen]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.kanal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: update-kanal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Steckwerk Desktop aus dem Bau-Job holen
        uses: actions/download-artifact@v4
        with:
          name: Steckwerk-Desktop-macOS
          path: ${{ runner.temp }}/rel

      - name: Mac-App und Pakete bauen
        env:
          STECKWERK_PAKETE: ${{ runner.temp }}/inst
          STECKWERK_DATEN: ${{ runner.temp }}/daten
        run: |
          REL="$RUNNER_TEMP/rel"
          python3 packaging/build_macos.py --out "$REL" --no-app
          git fetch --depth=1 origin updates
          git worktree add "$RUNNER_TEMP/kanal" FETCH_HEAD
          # Pakete, deren Version im Kanal fehlt, neu packen (Abhängigkeiten aus den Quellen installieren)
          python3 cli.py --paket-installieren paketquellen/verzierungen
          for d in paketquellen/*/; do
            [ -f "$d/paket.json" ] || continue
            id="$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["id"]+"-"+m["version"])' "$d/paket.json")"
            if ! git -C "$RUNNER_TEMP/kanal" ls-files --error-unmatch "pakete/$id.swpaket" >/dev/null 2>&1 \
               && [ -n "$(git -C "$RUNNER_TEMP/kanal" ls-files "pakete/${id%%-*}-*.swpaket")" ]; then
              python3 cli.py --paket-packen "$d" --out "$REL"
            fi
          done
          ls -la "$REL"

      - name: Kanal bauen und prüfen
        run: |
          REL="$RUNNER_TEMP/rel"
          K="$RUNNER_TEMP/kanal"
          V="$(python3 -c 'from steckwerk import __version__; print(__version__)')"
          PAKETE=()
          for f in "$REL"/*.swpaket; do [ -e "$f" ] && PAKETE+=(--paket "$f"); done
          python3 packaging/update_kanal.py "$K" --mac "$REL/Steckwerk-$V-macOS.zip" \
            --desktop "$REL/Steckwerk-Desktop-macOS.zip" "${PAKETE[@]}"
          python3 - "$K" "$V" <<'PY'
          import hashlib, json, os, sys
          k, v = sys.argv[1], sys.argv[2]
          feed = json.load(open(os.path.join(k, "feed.json")))
          prog = feed["programm"]
          assert prog["version"] == v and prog["mac"] and prog["desktop"] and prog["hinweise"], prog
          for e in [prog["mac"], prog["desktop"]] + feed["pakete"]:
              data = open(os.path.join(k, e["datei"]), "rb").read()
              assert hashlib.sha256(data).hexdigest() == e["sha256"], e["datei"]
          print("Programm", v, "+ Desktop;", ", ".join(f"{p['id']} {p['version']}" for p in feed["pakete"]))
          PY
          git -C "$K" status --short

      - name: Kanal veröffentlichen
        run: |
          K="$RUNNER_TEMP/kanal"
          V="$(python3 -c 'from steckwerk import __version__; print(__version__)')"
          cd "$K"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Kanal ist schon aktuell"; exit 0; fi
          git commit -m "Kanal: Steckwerk $V mit Steckwerk Desktop"
          git push origin HEAD:updates
