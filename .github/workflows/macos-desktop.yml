name: macOS Desktop

# Baut die native App „Steckwerk Desktop“ (packaging/swift) auf einem macOS-Runner.
# Der Branch „updates“ und Tags werden bewusst nicht angefasst; veröffentlicht wird über release.yml.
on:
  push:
    branches-ignore: [updates]
    tags-ignore: ["*"]
    paths:
      - "packaging/swift/**"
      - "packaging/build_macos.py"
      - "packaging/update_kanal.py"
      - ".github/workflows/macos-desktop.yml"
      - "*.py"
      - "models/**"
      - "motive/**"
      - "web/**"
  pull_request:
    paths:
      - "packaging/swift/**"
      - "packaging/build_macos.py"
      - "packaging/update_kanal.py"
      - ".github/workflows/macos-desktop.yml"
      - "*.py"
      - "models/**"
      - "motive/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bauen, testen, App-Bundle
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          python3 --version

      - name: Bauen
        working-directory: packaging/swift
        run: swift build

      - name: Python-Tests für Startskript und ChatGPT
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -q pytest
          "$RUNNER_TEMP/venv/bin/python" -m pytest -v tests/test_desktop_bridge.py tests/test_updater.py

      - name: Tests (mit Integrationstest gegen die echte Engine)
        working-directory: packaging/swift
        env:
          STECKWERK_ROOT: ${{ github.workspace }}
        run: swift test

      - name: App-Bundle bauen (Apple Silicon und Intel)
        working-directory: packaging/swift
        run: ./build_app.sh ../dist

      - name: Bundle prüfen
        run: |
          APP="packaging/dist/Steckwerk Desktop.app"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/SteckwerkDesktop"
          test -f "$APP/Contents/Resources/engine/webui.py"
          test -f "$APP/Contents/Resources/engine/bridge_start.py"

      - name: Selbsttest des fertigen Bundles
        run: '"packaging/dist/Steckwerk Desktop.app/Contents/MacOS/SteckwerkDesktop" --self-test'

      - name: ZIP erstellen
        working-directory: packaging/dist
        run: cp Steckwerk-Desktop-*-macOS.zip Steckwerk-Desktop-macOS.zip

      - name: Selbst-Update prüfen (ältere App durch das ZIP ersetzen, danach Signatur und Selbsttest)
        run: |
          T="$RUNNER_TEMP/selbstupdate"
          mkdir -p "$T/Programme" "$T/daten"
          ditto "packaging/dist/Steckwerk Desktop.app" "$T/Programme/Steckwerk Desktop.app"
          plutil -replace CFBundleShortVersionString -string 0.0.1 "$T/Programme/Steckwerk Desktop.app/Contents/Info.plist"
          STECKWERK_DATEN="$T/daten" STECKWERK_UPDATE_KANAL="file://$T/kanal/feed.json" python3 - "$T" <<'PY'
          import os, sys
          sys.path[:0] = [os.getcwd(), os.path.join(os.getcwd(), "packaging")]
          import update_kanal, updater
          from steckwerk import __version__
          t = sys.argv[1]
          feed = update_kanal.build(os.path.join(t, "kanal"), None, [], desktop="packaging/dist/Steckwerk-Desktop-macOS.zip")
          assert feed["desktop"]["version"] == __version__ and feed["desktop"]["mac"], feed
          app = os.path.join(t, "Programme", "Steckwerk Desktop.app")
          check = updater.desktop_check(app)
          assert check["neu"] and check["kann_installieren"], check
          print(updater.install_desktop(app))
          assert updater.app_version(app) == __version__
          PY
          codesign --verify --deep --strict --verbose=2 "$T/Programme/Steckwerk Desktop.app"
          "$T/Programme/Steckwerk Desktop.app/Contents/MacOS/SteckwerkDesktop" --self-test

      - name: DMG erstellen
        working-directory: packaging/swift
        run: ./make_dmg.sh "../dist/Steckwerk Desktop.app" ../dist/Steckwerk-Desktop-macOS.dmg

      - name: DMG prüfen (einhängen, Inhalt, Selbsttest aus dem Image)
        run: |
          MNT="$(mktemp -d)"
          hdiutil attach packaging/dist/Steckwerk-Desktop-macOS.dmg -nobrowse -readonly -mountpoint "$MNT"
          ls -la "$MNT"
          test -L "$MNT/Programme"
          codesign --verify --deep --strict "$MNT/Steckwerk Desktop.app"
          "$MNT/Steckwerk Desktop.app/Contents/MacOS/SteckwerkDesktop" --self-test
          hdiutil detach "$MNT"

      - name: DMG hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Steckwerk-Desktop-macOS-dmg
          path: packaging/dist/Steckwerk-Desktop-macOS.dmg
          retention-days: 14
          if-no-files-found: error

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Steckwerk-Desktop-macOS
          path: packaging/dist/Steckwerk-Desktop-macOS.zip
          retention-days: 14
          if-no-files-found: error
