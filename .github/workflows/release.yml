name: Release

# Neue Version veröffentlichen: __version__ in steckwerk.py erhöhen, CHANGELOG ergänzen,
# dann  git tag v1.6.0 && git push origin v1.6.0
# oder unter Actions → Release → „Run workflow“ auf main starten: dann wird das Tag v<Version>
# aus steckwerk.py gesetzt. Zum Schluss landen Mac-App und Desktop-App im Update-Kanal (Branch „updates“).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04      # ubuntu-latest (26.04) hat kein Python 3.9 mehr
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install pytest
      - name: Version passt zum Tag
        id: tag
        run: |
          V=$(python -c "import steckwerk; print(steckwerk.__version__)")
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v$V"
          else
            TAG="$GITHUB_REF_NAME"
            test "v$V" = "$TAG" || { echo "Tag $TAG ≠ Version $V"; exit 1; }
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: python -m pytest -q tests
      - name: Mac-App packen
        run: python packaging/build_macos.py --out dist --no-app
      - name: Beispielpaket packen
        run: python cli.py --paket-packen beispiel-pakete/tuerschild --out dist
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${TAG#v}
          awk -v v="$V" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/*.zip dist/*.swpaket --target "$GITHUB_SHA" --title "Steckwerk $V" --notes-file notes.md

  desktop:
    name: Steckwerk Desktop (macOS)
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: App bauen und testen
        working-directory: packaging/swift
        run: swift test && ./build_app.sh ../../dist
      - name: Ans Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/Steckwerk-Desktop-*-macOS.zip --clobber

  kanal:
    name: Update-Kanal
    needs: [release, desktop]
    runs-on: ubuntu-24.04      # ubuntu-latest (26.04) hat kein Python 3.9 mehr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: updates
          path: kanal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Pakete mit neuer Version packen
        env:
          STECKWERK_PAKETE: ${{ runner.temp }}/inst
          STECKWERK_DATEN: ${{ runner.temp }}/daten
        run: |
          # Pakete, deren Version im Kanal fehlt, neu packen (Abhängigkeiten aus den Quellen installieren)
          mkdir -p rel
          python cli.py --paket-installieren paketquellen/verzierungen
          for d in paketquellen/*/; do
            [ -f "$d/paket.json" ] || continue
            id="$(python -c 'import json,sys; m=json.load(open(sys.argv[1])); print(m["id"]+"-"+m["version"])' "$d/paket.json")"
            if [ ! -e "kanal/pakete/$id.swpaket" ] && ls kanal/pakete/"${id%%-*}"-*.swpaket >/dev/null 2>&1; then
              python cli.py --paket-packen "$d" --out rel
            fi
          done
          ls -la rel
      - name: Release-Dateien holen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release download "$TAG" --dir rel --pattern "Steckwerk-*-macOS.zip"
      - name: Kanal auffrischen und veröffentlichen
        run: |
          PAKETE=()
          for f in rel/*.swpaket; do [ -e "$f" ] && PAKETE+=(--paket "$f"); done
          python packaging/update_kanal.py kanal --mac rel/Steckwerk-[0-9]*-macOS.zip --desktop rel/Steckwerk-Desktop-*-macOS.zip \
            "${PAKETE[@]}"
          cd kanal
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Kanal unverändert"; exit 0; }
          git commit -m "Kanal: Steckwerk ${{ needs.release.outputs.tag }}"
          git push origin HEAD:updates
