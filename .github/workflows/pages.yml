name: Webseite

# Baut die Steckwerk-Webseite (webseite/ + Modellbilder aus den Paketquellen) und stellt sie auf GitHub Pages.
# Einmalig nötig: Settings → Pages → Source „GitHub Actions“.
on:
  push:
    branches: [main]
    paths: ["webseite/**", "paketquellen/**", "packaging/webseite.py", "steckwerk.py"]
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Webseite bauen
        run: python packaging/webseite.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
